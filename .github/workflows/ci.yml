name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:  # both ends of the supported range
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tags after v7; pin an exact release
        with:
          python-version: ${{ matrix.python }}

      - name: Use scratch locations for the index and model cache
        run: |
          echo "VAULT_INDEX_DB=$RUNNER_TEMP/vault-index.db" >> "$GITHUB_ENV"
          echo "VAULT_MODEL_CACHE=$RUNNER_TEMP/models" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/models
          key: fastembed-bge-small-minilm-rerank-${{ runner.os }}

      - name: One-command setup (what a new user runs)
        run: uv run --project mcp python scripts/setup.py --memory-file "$RUNNER_TEMP/memory.jsonl"

      - name: Lint
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: uvx ruff check .

      - name: Tests
        run: uv run --project mcp --with pytest pytest tests -q

      - name: Retrieval eval (fails on a drop of more than 0.03 vs eval/baseline.json)
        run: uv run --project mcp python eval/run_eval.py --modes all

      - name: Invariants
        run: uv run --project mcp python scripts/invariants.py
