name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Use scratch locations for the index, model cache and memory graph
        run: |
          echo "VAULT_INDEX_DB=$RUNNER_TEMP/vault-index.db" >> "$GITHUB_ENV"
          echo "VAULT_MODEL_CACHE=$RUNNER_TEMP/models" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: fastembed-bge-small-en-v1.5-${{ runner.os }}

      - name: Install
        run: uv sync --project mcp

      - name: MCP config from the example
        run: |
          uv run --project mcp python -c "
          import json, os
          c = json.load(open('.mcp.json.example'))
          c['mcpServers']['memory']['env']['MEMORY_FILE_PATH'] = os.environ['RUNNER_TEMP'] + '/memory.jsonl'
          json.dump(c, open('.mcp.json', 'w'), indent=2)
          "

      - name: Lint
        if: runner.os == 'Linux'
        run: uvx ruff check .

      - name: Tests
        run: uv run --project mcp --with pytest pytest tests -q

      - name: Retrieval eval (fails on a drop of more than 0.03 vs eval/baseline.json)
        run: uv run --project mcp python eval/run_eval.py --modes all

      - name: Invariants
        run: uv run --project mcp python scripts/invariants.py
